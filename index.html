<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0b0a10">
  <meta name="description" content="Portfolio of Jerdenn Calag — Systems Administrator and IT Specialist. Cloud infrastructure, endpoint security, automation, API integrations and internal AI platforms.">
  <title>Jerdenn Calag — Systems Administrator & IT Specialist</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500;600&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root{
      --bg:#0b0a10;--bg2:#0f0d17;--panel:#14121d;--panel2:#1a1624;--stroke:rgba(210,200,236,.13);
      --white:#f7f6fb;--text:#e9e6f0;--muted:#a5a0b5;--muted2:#777185;
      --violet:#a78bfa;--pink:#f472b6;--orange:#fb923c;--mint:#34d399;
      --mono:'Fira Code',ui-monospace,SFMono-Regular,Consolas,monospace;
      --sans:'Plus Jakarta Sans',Inter,Arial,sans-serif;
      --rad:19px;--shadow:0 24px 80px rgba(0,0,0,.31);
    }
    *{box-sizing:border-box}
    html{scroll-behavior:smooth;scroll-padding-top:108px}
    body{margin:0;background:var(--bg);color:var(--text);font-family:var(--sans);font-size:15px;line-height:1.65;overflow-x:hidden}
    body::before{content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;background:radial-gradient(ellipse at 11% 6%,rgba(102,58,144,.13),transparent 38%),radial-gradient(ellipse at 92% 20%,rgba(166,85,86,.055),transparent 45%),linear-gradient(180deg,#0b0a10 0%,#0c0b11 55%,#0a0a0e 100%)}
    ::selection{background:#9b7dff;color:#06030d}
    a{color:inherit;text-decoration:none}
    button,input{font:inherit}
    button{cursor:pointer}
    button:focus-visible,a:focus-visible,input:focus-visible,summary:focus-visible{outline:2px solid var(--violet);outline-offset:5px}
    img{max-width:100%;display:block}
    .shell{width:min(1280px,calc(100% - 80px));margin-inline:auto}
    .mono{font-family:var(--mono)}
    .site-header{height:86px;position:sticky;top:0;z-index:100;border-bottom:1px solid rgba(216,208,228,.09);backdrop-filter:blur(20px);background:rgba(9,8,14,.79)}
    .nav-inner{height:100%;display:flex;align-items:center;gap:40px}
    .brand{display:inline-flex;align-items:center;gap:13px;flex-shrink:0}
    .brand-box{width:42px;height:42px;display:grid;place-items:center;border:1px solid rgba(167,139,250,.48);border-radius:11px;background:linear-gradient(135deg,rgba(167,139,250,.2),rgba(244,114,182,.045));font-weight:800;color:#f0e9ff;letter-spacing:-.08em;font-size:16px;box-shadow:inset 0 1px rgba(255,255,255,.06)}
    .brand-name{font-weight:800;color:#f6f3fa;font-size:15px;letter-spacing:-.04em;line-height:1.05}
    .brand-name small{display:block;font:400 10px var(--mono);letter-spacing:0;color:var(--muted);margin-top:5px}
    .nav-links{display:flex;align-items:center;gap:34px;margin-left:auto}
    .nav-links a{font:500 11px var(--mono);color:#bcb6c7;letter-spacing:.045em;transition:color .2s}
    .nav-links a:hover{color:var(--white)}
    .nav-cta{display:inline-flex;align-items:center;justify-content:center;gap:12px;padding:11px 16px;border:1px solid rgba(255,255,255,.18);border-radius:100px;color:var(--white);font:500 11px var(--mono);white-space:nowrap;transition:background .2s,border-color .2s}
    .nav-cta:hover{border-color:var(--violet);background:rgba(167,139,250,.1)}
    .mobile-toggle{display:none;border:1px solid var(--stroke);background:rgba(255,255,255,.04);color:#fff;padding:9px 13px;border-radius:10px;font:500 11px var(--mono)}
    .hero{min-height:710px;display:grid;grid-template-columns:minmax(0,1.16fr) minmax(0,.84fr);gap:48px;align-items:center;padding:86px 0 94px;position:relative}
    .hero::before{content:"";position:absolute;left:29%;top:6%;height:560px;width:560px;border-radius:50%;background:radial-gradient(circle,rgba(94,55,149,.085),transparent 60%);pointer-events:none}
    .hero-copy{position:relative;z-index:1}
    .eyebrow{display:flex;align-items:center;gap:12px;font:500 11px var(--mono);letter-spacing:.15em;text-transform:uppercase;color:var(--mint)}
    .eyebrow .eyebrow-line{width:35px;height:1px;background:var(--mint);opacity:.58}
    h1,h2,h3,p{margin-top:0}
    .hero h1{font-size:clamp(51px,5.48vw,86px);line-height:1.11;letter-spacing:-.075em;font-weight:800;color:#fcfbff;margin:28px 0 26px;max-width:790px}
    .hero h1 span{display:block}
    .hero h1 .gradient-words{background:linear-gradient(104deg,#b59dff 5%,#ec91c2 51%,#ffac72 88%);background-clip:text;-webkit-background-clip:text;color:transparent;padding-bottom:6px}
    .hero-lede{max-width:590px;color:#aaa5b5;font-size:16.5px;line-height:1.9;margin:0 0 33px}
    .hero-lede strong{color:#eeecf4;font-weight:600}
    .button-row{display:flex;flex-wrap:wrap;gap:13px}
    .btn{display:inline-flex;align-items:center;justify-content:center;gap:15px;border-radius:12px;padding:15px 22px;font-weight:800;font-size:12px;letter-spacing:.01em;min-height:52px;transition:transform .2s,box-shadow .2s,border-color .2s}
    .btn:hover{transform:translateY(-2px)}
    .btn-primary{background:#ded2ff;color:#100c18;box-shadow:0 12px 34px rgba(167,139,250,.16)}
    .btn-primary:hover{box-shadow:0 13px 40px rgba(167,139,250,.3)}
    .btn-ghost{color:#efebf3;border:1px solid rgba(255,255,255,.19)}
    .btn-ghost:hover{border-color:var(--pink)}
    .hero-foot{display:flex;align-items:center;gap:14px;font:400 11px var(--mono);color:#888495;letter-spacing:.03em;margin-top:40px;max-width:580px}
    .hero-foot .line{height:1px;background:#3b3646;width:43px}
    .photo-area{position:relative;width:min(100%,450px);justify-self:end;padding-top:22px}
    .photo-glow{position:absolute;inset:1% -3% 8%;background:radial-gradient(ellipse at 48% 52%,rgba(149,101,254,.2),rgba(244,114,182,.11) 38%,transparent 72%);filter:blur(20px)}
    .portrait-frame{position:relative;height:535px;border-radius:180px 180px 24px 24px;padding:13px;border:1px solid rgba(255,255,255,.15);background:linear-gradient(150deg,rgba(190,159,255,.24),rgba(30,21,44,.3) 34%,rgba(251,146,60,.12) 92%);box-shadow:var(--shadow)}
    .portrait-inner{width:100%;height:100%;border-radius:171px 171px 16px 16px;overflow:hidden;position:relative;background:#bab4bf}
    .portrait-inner img{height:100%;width:100%;object-fit:cover;object-position:center 18%;filter:contrast(1.04) saturate(.78)}
    .portrait-inner::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,transparent 58%,rgba(14,9,25,.38));pointer-events:none}
    .photo-caption{position:absolute;bottom:39px;left:-37px;right:15px;display:flex;align-items:end;justify-content:space-between;gap:10px;z-index:1}
    .photo-label{padding:13px 17px;border:1px solid rgba(255,255,255,.19);border-radius:12px;background:rgba(18,15,27,.85);box-shadow:0 18px 42px rgba(0,0,0,.27);backdrop-filter:blur(12px)}
    .photo-label strong{font-size:13px;line-height:1.2;color:#fff;display:block}
    .photo-label small{font:400 10px var(--mono);color:#c7bdd4;display:block;margin-top:5px}
    .photo-index{background:#dfd2ff;color:#241633;border-radius:10px;padding:14px 12px;font:700 12px var(--mono);box-shadow:0 9px 32px rgba(0,0,0,.29)}
    .side-label{position:absolute;top:190px;right:-29px;writing-mode:vertical-rl;transform:rotate(180deg);font:500 10px var(--mono);letter-spacing:.21em;color:#b8adcf}
    .hero-orbit{position:absolute;border:1px solid rgba(167,139,250,.2);border-radius:50%;width:63px;height:63px;right:-27px;top:47px;display:grid;place-items:center;color:#b89bff;font-size:21px}
    .stats{border-block:1px solid var(--stroke);display:grid;grid-template-columns:repeat(4,minmax(0,1fr));margin-bottom:110px;background:linear-gradient(90deg,rgba(255,255,255,.015),transparent)}
    .stat{padding:27px 25px 29px;border-right:1px solid var(--stroke)}.stat:first-child{padding-left:0}.stat:last-child{border-right:none}
    .stat-number{display:block;color:#f4effb;font-size:clamp(34px,3.1vw,46px);line-height:1.15;font-weight:800;letter-spacing:-.08em}
    .stat-number span{color:var(--pink)}
    .stat-label{font:400 11px var(--mono);color:#aaa2b6;letter-spacing:.015em;margin-top:8px;display:block}
    .section{margin-bottom:140px}
    .section-bar{font:500 11px var(--mono);color:var(--mint);letter-spacing:.12em;display:flex;align-items:center;gap:14px;margin-bottom:22px;text-transform:uppercase}
    .section-bar::before{content:"";width:24px;height:1px;background:var(--mint)}
    .section-heading{display:flex;justify-content:space-between;align-items:end;gap:60px;margin-bottom:43px}
    .section-heading h2{font-size:clamp(38px,4.7vw,68px);line-height:1.17;letter-spacing:-.07em;font-weight:800;color:#f8f6fc;margin:0}
    .section-heading h2 span{color:#81768f}
    .section-desc{font-size:14px;color:#a9a4b5;line-height:1.85;max-width:355px;margin:0 0 4px}
    .principles{display:grid;grid-template-columns:1fr 1fr 1fr;border:1px solid var(--stroke);border-radius:var(--rad);background:linear-gradient(140deg,rgba(167,139,250,.045),rgba(255,255,255,.012));overflow:hidden}
    .principle{padding:30px 32px 34px;border-right:1px solid var(--stroke)}.principle:last-child{border-right:0}
    .principle .principle-icon{display:inline-flex;justify-content:center;align-items:center;width:42px;height:42px;border-radius:11px;font:500 17px var(--mono);background:rgba(167,139,250,.12);color:var(--violet);border:1px solid rgba(167,139,250,.15)}
    .principle:nth-child(2) .principle-icon{color:var(--pink);background:rgba(244,114,182,.1);border-color:rgba(244,114,182,.16)}
    .principle:nth-child(3) .principle-icon{color:var(--orange);background:rgba(251,146,60,.1);border-color:rgba(251,146,60,.17)}
    .principle h3{font-size:18px;letter-spacing:-.04em;color:#f0edf5;margin:23px 0 7px}.principle p{color:#aca5b8;margin:0;font-size:13px;line-height:1.85}
    .project-toolbar{display:flex;align-items:center;justify-content:space-between;gap:18px;flex-wrap:wrap;margin:0 0 26px}
    .filter-group{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
    .filter-btn{border:1px solid transparent;color:#ada7b9;background:transparent;font:500 11px var(--mono);border-radius:40px;padding:10px 14px;transition:.2s}
    .filter-btn:hover{color:#fff;background:rgba(255,255,255,.04)}
    .filter-btn[aria-pressed="true"]{background:#e0d3ff;color:#181120;border-color:#e0d3ff;font-weight:600}
    .project-search{display:flex;align-items:center;gap:12px;padding:9px 15px;border-radius:30px;background:rgba(255,255,255,.035);border:1px solid var(--stroke);color:#bdb2c9;font:12px var(--mono);width:220px}
    .project-search input{background:none;outline:none;border:0;color:#f5f0fa;min-width:0;width:100%;font-size:11px}
    .project-search input::placeholder{color:#7f758f}
    .project-layout{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:18px}
    .project-card{border:1px solid var(--stroke);border-radius:var(--rad);background:linear-gradient(150deg,rgba(29,24,38,.9),rgba(17,15,24,.98));min-width:0;position:relative;overflow:hidden}
    .project-card[hidden]{display:none!important}
    .featured-card{grid-column:span 12;display:grid;grid-template-columns:1.07fr .93fr;min-height:510px;box-shadow:0 14px 60px rgba(0,0,0,.1)}
    .featured-card--alt{grid-template-columns:1.07fr .93fr}
    .feature-copy{padding:45px 49px 35px;position:relative;z-index:1;display:flex;flex-direction:column}
    .project-top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:29px}
    .project-index{font:500 10px var(--mono);letter-spacing:.12em;color:#bfadd6}
    .project-state{font:400 10px var(--mono);color:#9fe4c8;padding:7px 11px;border:1px solid rgba(52,211,153,.22);border-radius:40px;white-space:nowrap}
    .feature-symbol{font:500 13px var(--mono);color:#d6b9ff;display:flex;align-items:center;gap:15px;margin-bottom:18px}
    .symbol-line{width:54px;height:1px;background:#5f506c;display:inline-block}
    .project-kicker{color:#9f92ad;font:500 11px var(--mono);letter-spacing:.11em}
    .featured-card h3{font-size:clamp(30px,3vw,46px);line-height:1.16;letter-spacing:-.055em;margin:13px 0 17px;color:white}
    .project-desc{font-size:14px;line-height:1.9;color:#bcb3c9;margin-bottom:23px}
    .tags{display:flex;flex-wrap:wrap;gap:7px;margin-top:auto}
    .tech-chip{border:1px solid rgba(222,211,234,.12);background:rgba(255,255,255,.025);color:#c6bfd0;padding:6px 9px;border-radius:7px;font:500 10px var(--mono);line-height:1.45}
    .project-details{margin-top:24px;border-top:1px solid rgba(255,255,255,.11);padding-top:16px}
    .project-details summary{list-style:none;color:#cfc3e7;font:500 11px var(--mono);cursor:pointer;display:flex;align-items:center;justify-content:space-between;gap:13px}
    .project-details summary::-webkit-details-marker{display:none}
    .details-arrow{font-size:19px;line-height:1;color:#b8a3e6;transition:transform .15s}
    .project-details[open] .details-arrow{transform:rotate(45deg)}
    .project-details ul{padding:13px 0 0 17px;margin:0;color:#bbb2c7;font-size:12px;line-height:1.75}
    .project-details li+li{margin-top:5px}
    .feature-art{min-width:0;padding:40px;display:flex;align-items:center;justify-content:center;position:relative;border-left:1px solid rgba(255,255,255,.065);background:radial-gradient(ellipse at 67% 39%,rgba(167,139,250,.24),transparent 54%),linear-gradient(145deg,#151122,#191326)}
    .feature-art::before{content:"";position:absolute;inset:0;background-image:linear-gradient(rgba(238,223,255,.025) 1px,transparent 1px),linear-gradient(90deg,rgba(238,223,255,.025) 1px,transparent 1px);background-size:33px 33px;mask-image:linear-gradient(90deg,transparent,#000);pointer-events:none}
    .feature-art--pink{background:radial-gradient(ellipse at 64% 35%,rgba(244,114,182,.17),transparent 65%),linear-gradient(145deg,#1c1222,#15131d)}
    .preview-window{width:100%;max-width:472px;min-height:382px;background:rgba(17,16,24,.94);border:1px solid rgba(230,208,255,.17);border-radius:15px;box-shadow:0 34px 65px rgba(0,0,0,.39);position:relative;transform:rotate(1deg);overflow:hidden;z-index:2}
    .preview-support{transform:rotate(-1deg)}
    .window-header{display:flex;align-items:center;justify-content:space-between;background:#201b2c;border-bottom:1px solid rgba(255,255,255,.09);padding:15px 16px;color:#a9a0b9;font:500 9px var(--mono);letter-spacing:.045em}
    .window-dots{display:inline-flex;gap:4px}
    .window-dots b{height:7px;width:7px;border-radius:50%;background:#8e788b}.window-dots b:nth-child(1){background:#e7909f}.window-dots b:nth-child(2){background:#e9b978}.window-dots b:nth-child(3){background:#9bc6a8}
    .flow-canvas,.support-canvas{padding:20px 19px 16px}
    .mini-top{font:500 10px var(--mono);display:flex;align-items:center;justify-content:space-between;gap:9px;color:#c7c0d3;margin:0 0 20px}
    .mini-live{font-size:8px;color:#9fe9b6;white-space:nowrap}.mini-live i{display:inline-block;width:5px;height:5px;background:#40e5a9;border-radius:50%;margin-right:4px}
    .flow-node{display:flex;align-items:center;gap:13px;border:1px solid rgba(255,255,255,.1);background:#282134;border-radius:12px;padding:11px 11px;color:#e9e0f4;box-shadow:0 5px 15px rgba(0,0,0,.13)}
    .flow-node>div:nth-child(2){flex:1;min-width:0}.flow-node strong{font-size:11px;line-height:1.1;display:block}.flow-node small{display:block;font:400 9px var(--mono);color:#a99ebb;margin-top:5px}
    .node-icon{background:#44315f;color:#d9bcff;border-radius:7px;width:31px;height:31px;display:grid;place-items:center;font:600 10px var(--mono)}
    .flow-node>span{color:#a6e6c7;font:700 16px var(--mono)}
    .flow-mid{background:#30213e;border-color:rgba(167,139,250,.3)}
    .flow-path{margin:0 0 0 26px;width:1px;height:23px;background:linear-gradient(var(--violet),rgba(167,139,250,.25))}
    .preview-footer{display:flex;align-items:center;justify-content:space-between;gap:10px;border-top:1px solid rgba(255,255,255,.09);color:#a79eaf;font:400 9px var(--mono);padding-top:15px;margin-top:17px}
    .preview-footnote{color:#9b86ad;white-space:nowrap}
    .tenant-list{display:grid;gap:9px}.tenant{display:flex;align-items:center;gap:9px;padding:11px 10px;border:1px solid rgba(255,255,255,.11);border-radius:10px;background:rgba(255,255,255,.045)}
    .tenant-identity{height:33px;width:33px;border-radius:8px;display:grid;place-items:center;background:rgba(138,182,255,.2);color:#abdcff;font:600 10px var(--mono)}
    .tenant-identity-pink{background:rgba(244,114,182,.2);color:#f9b3d2}.tenant>div{flex:1;min-width:0}.tenant b{font-size:11px;display:block;color:#f7f2fc}.tenant small{font:400 8px var(--mono);color:#aaa1ba;display:block;margin-top:2px}
    .tenant em{font:500 8px var(--mono);font-style:normal;color:#92dfbf}
    .support-arrows{text-align:center;color:#bd93e9;font-size:14px;letter-spacing:.5em;margin:5px 0}
    .support-agent{text-align:center;border:1px solid rgba(244,114,182,.25);background:linear-gradient(135deg,rgba(244,114,182,.14),rgba(167,139,250,.12));border-radius:10px;padding:12px 10px;display:flex;flex-direction:column;align-items:center}
    .agent-orb{height:28px;width:28px;border-radius:50%;display:grid;place-items:center;background:rgba(244,114,182,.3);color:#fbc4df;font-size:16px}.support-agent strong{font-size:11px;margin-top:3px}.support-agent span{font:400 9px var(--mono);color:#bcb0ca;margin-top:2px}
    .support-dock{display:flex;align-items:center;gap:10px;padding:10px;background:#262232;border-radius:9px;margin-top:11px}.dock-icon{height:28px;width:28px;border-radius:7px;display:grid;place-items:center;color:#bce2ff;background:#27364b}.support-dock>div:nth-child(2){flex:1}.support-dock b{font-size:11px;display:block}.support-dock small{font:400 8px var(--mono);color:#aa9fb6}.support-check{color:#83d9ad;font-size:12px}
    .work-card{grid-column:span 4;display:flex;flex-direction:column;padding:27px 27px 20px;transition:transform .25s,border-color .25s,background .25s}
    .work-card:hover{transform:translateY(-5px);border-color:rgba(167,139,250,.37);background:linear-gradient(150deg,rgba(34,27,46,.98),rgba(20,17,28,.98))}
    .work-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:24px}
    .work-serial{font:500 10px var(--mono);letter-spacing:.12em;color:#9d94ad}
    .work-glyph{border:1px solid rgba(167,139,250,.24);width:41px;height:41px;display:grid;place-items:center;color:var(--violet);border-radius:10px;background:rgba(167,139,250,.09);font-size:22px;line-height:1}
    .accent--orange .work-glyph{color:var(--orange);border-color:rgba(251,146,60,.24);background:rgba(251,146,60,.08)}
    .accent--green .work-glyph{color:var(--mint);border-color:rgba(52,211,153,.24);background:rgba(52,211,153,.07)}
    .accent--pink .work-glyph{color:var(--pink);border-color:rgba(244,114,182,.24);background:rgba(244,114,182,.07)}
    .work-kind{font:500 10px var(--mono);letter-spacing:.07em;color:#a294b6}
    .work-card h3{margin:13px 0 8px;color:#f6f2f9;letter-spacing:-.043em;font-size:22px;line-height:1.3}
    .work-status{display:flex;align-items:center;gap:8px;color:#a3cfbb;font:400 10px var(--mono);margin:2px 0 17px}
    .status-dot{width:6px;height:6px;background:#48bf98;border-radius:50%;box-shadow:0 0 0 3px rgba(72,191,152,.1)}
    .work-card>p{font-size:12.5px;line-height:1.85;color:#b4adbd;margin-bottom:26px}
    .work-card .tags{margin-top:auto}.work-card .tech-chip{font-size:9px}
    .work-card .project-details{margin-top:19px}
    .empty-state{display:none;margin-top:20px;border:1px dashed rgba(167,139,250,.3);border-radius:var(--rad);padding:37px 24px;text-align:center;color:#bbb1c7}
    .roadmap{display:grid;grid-template-columns:230px repeat(3,minmax(0,1fr));gap:24px;align-items:start;border:1px solid var(--stroke);border-radius:16px;padding:27px 30px;margin-t
